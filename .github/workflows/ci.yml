name: CI

on:
  push:
    branches: [master, wip]
  pull_request:

# デバッグ情報を作らない（ビルドとリンクが速くなり、キャッシュも小さくなる。scripts/check-rust.sh と同じ）
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/wip' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: ネイティブ通話の相互接続試験用サーバー
        run: cargo build -p disnans-server --locked
      - uses: actions/upload-artifact@v4
        with:
          name: native-call-test-server-linux
          path: target/debug/disnans-server
          retention-days: 1
      - name: 生成した TypeScript の型がコミット済みか確認
        run: git diff --exit-code app/src/lib/protocol app/src/lib/emojiNames.generated.ts app/src/lib/uiTree.generated.ts

  # 共通ファイルの排他・置換、CLI のプロセス境界、サーバーの上書きしない復元を Windows でも検証する。
  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/wip' }}
      - run: cargo clippy -p disnans-client-core -p disnans-cli --all-targets --locked -- -D warnings
      - run: cargo test -p disnans-client-core -p disnans-cli --locked
      - name: サーバーのファイル操作（Windows の no-replace を含む）
        run: cargo test -p disnans-server --lib --locked

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx svelte-check
      - run: npx vitest run
      - run: npm run build
      # CLI を配置するスクリプトの単体テスト（配置の名前・ビルドの呼び出し・失敗時の動き）
      - run: node --test ../scripts/prepare-cli.test.mjs ../scripts/release-latest-json.test.mjs ../scripts/notifier-permissions.test.mjs ../scripts/plugin-permissions.test.mjs ../scripts/check-docs.test.mjs
      # markdown の相対リンクとアンカーが壊れていないこと
      - run: node ../scripts/check-docs.mjs

  # 通話の純粋部分は JVM で実行し、Android のサービスと橋渡しは実際の SDK/Tauri API でコンパイルする。
  # APK のインストール・マイクの取得・実デバイスへの接続はしない。
  android-call:
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1
          cache-read-only: ${{ github.ref != 'refs/heads/wip' }}
      - uses: actions/download-artifact@v4
        with:
          name: native-call-test-server-linux
          path: ${{ runner.temp }}/native-call-test-server
      - name: 今回ビルドした一時サーバーだけを相互接続試験に使う
        run: |
          chmod +x "$RUNNER_TEMP/native-call-test-server/disnans-server"
          echo "DISNANS_NATIVE_TEST_SERVER_BIN=$RUNNER_TEMP/native-call-test-server/disnans-server" >> "$GITHUB_ENV"
      - name: 通話プロトコル・音声処理・復帰制御・現サーバーとの相互接続の JVM テスト
        run: gradle --no-daemon -p app/src-tauri/plugins/notifier/native-tests nativeCallTest
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
        with:
          # 廃止された既定の tools は不要。コンパイル用の SDK だけを入れる（adb は使わない）。
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: ロック済みの Tauri Android API を使う
        shell: bash
        run: |
          cargo metadata --manifest-path app/src-tauri/Cargo.toml --locked --filter-platform aarch64-linux-android --format-version 1 > "$RUNNER_TEMP/android-metadata.json"
          manifest=$(jq -r '.packages[] | select(.name == "tauri") | .manifest_path' "$RUNNER_TEMP/android-metadata.json")
          test -n "$manifest" && test -f "$manifest"
          echo "TAURI_ANDROID_DIR=$(dirname "$manifest")/mobile/android" >> "$GITHUB_ENV"
      - name: 通知プラグインの Kotlin・マニフェストをコンパイルし、ローカル通信を試験
        run: gradle --no-daemon -p app/src-tauri/plugins/notifier/android-check :notifier:assembleDebug :notifier:testDebugUnitTest

  # Desktop IPC と共通ファイル移行の Rust 側を Windows のネイティブ環境でも検証する。
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # wip のものだけ保存する（master へは下の promote が進めるだけで、CI は動かない）
          save-if: ${{ github.ref == 'refs/heads/wip' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      # build.rs は externalBin（CLI の配置物）の存在を確かめるので、先に stub を置く（本物ではない。インストーラには使わない）
      - name: CLI の stub を置く
        run: node scripts/prepare-cli.mjs --stub
      - run: cargo clippy --lib --tests --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri

  # Linux の Rust（Tauri 本体と画面共有 linux_capture.rs）をビルドしてテストする。
  # 画面共有の依存: GStreamer の開発パッケージ（gstreamer-app は plugins-base も要る）。実行時の gstreamer1.0-pipewire と xdg-desktop-portal は CI では使わない
  app-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Linux の依存ライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          # wip のものだけ保存する（master へは下の promote が進めるだけで、CI は動かない）
          save-if: ${{ github.ref == 'refs/heads/wip' }}
      # tauri::generate_context! が読む frontendDist（app/dist は Git に入らない）を先に作る
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: CLI の stub を置く（build.rs が配置物の存在を確かめるため。本物ではない）
        run: node scripts/prepare-cli.mjs --stub
      - name: テスト（画面共有の計算を含む）
        working-directory: app/src-tauri
        run: cargo test --locked

  # NSIS インストーラのフック（PATH の追加と削除）の文字列処理を、レジストリに触れずにテストする。
  # 本物のインストーラのコンパイルと実際の PATH の確認は release.yml が行う。
  nsis-hook:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: NSIS を入れる
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Makensis {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            foreach ($base in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              $candidate = Join-Path $base 'NSIS\makensis.exe'
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
            }
          }
          # Chocolatey の取得失敗で、終了コードが 0 でも未インストールになる場合がある。
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $makensis = Find-Makensis
            if ($makensis) { break }
            choco install nsis -y --no-progress
            $installExit = $LASTEXITCODE
            $makensis = Find-Makensis
            if ($makensis) { break }
            if ($attempt -eq 3) { throw "NSIS を取得できませんでした（終了コード: $installExit）" }
            Write-Warning "NSIS がありません。取得を再試行します（$attempt/3、終了コード: $installExit）"
            Start-Sleep -Seconds (10 * $attempt)
          }
          "NSIS_MAKENSIS=$makensis" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0
      - name: テストをコンパイルして実行し、結果を確かめる
        working-directory: scripts/nsis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = $env:NSIS_MAKENSIS
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) { throw 'NSIS の実行ファイルがありません' }
          # Tauri のインストーラと同じく、スクリプトは UTF-8 として読む（既定の ANSI だと日本語の文字列が崩れる）
          & $makensis -INPUTCHARSET UTF8 /WX cli-path-harness.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis が失敗しました' }
          # NSIS の exe は GUI アプリなので、& で呼ぶと終わりを待たない（終了コードも取れない）。Start-Process -Wait で待つ
          $harness = Start-Process -FilePath .\cli-path-harness.exe -Wait -PassThru
          $harnessExit = $harness.ExitCode
          if (-not (Test-Path cli-path-results.txt)) {
            Write-Host "結果ファイルがありません（harness の終了コード: $harnessExit）。このフォルダの中身:"
            Get-ChildItem -Force | Format-Table Name, Length | Out-String | Write-Host
            throw 'harness が結果を書きませんでした'
          }
          # .onInit で Quit すると NSIS は終了コード 2（中断）を返す。成否は結果ファイルの内容で判定する
          Write-Host "harness の終了コード: $harnessExit"
          node check-cli-path-results.mjs cli-path-results.txt
          if ($LASTEXITCODE -ne 0) { throw '期待と違う結果があります' }

  # wip の CI がすべて通ったら、master をその commit まで進める（早送りだけ。master が先にあれば何もしない）。
  # GITHUB_TOKEN での更新はワークフローを起動しないので、master で CI は二重に動かない。
  promote:
    if: github.ref == 'refs/heads/wip' && github.event_name == 'push'
    needs: [server, client-windows, app, android-call, app-windows, app-linux, nsis-hook]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: master を早送りする
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # master から見たこの commit: ahead=進める、identical/behind=すでに含む（古い実行が後から終わった）、diverged=早送りできない
          status=$(gh api "repos/$REPO/compare/master...$SHA" --jq .status)
          echo "master...$SHA: $status"
          case "$status" in
            ahead) gh api -X PATCH "repos/$REPO/git/refs/heads/master" -f sha="$SHA" -F force=false > /dev/null && echo "master を $SHA に進めました" ;;
            identical|behind) echo "master はすでにこの commit を含みます" ;;
            *) echo "::error::master と分岐しているので早送りできません（$status）"; exit 1 ;;
          esac
