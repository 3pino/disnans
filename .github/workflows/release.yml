# タグ（v0.1.1 など）を push すると、全プラットフォームをビルドして GitHub Releases に公開する。
# タグのバージョンは app/src-tauri/tauri.conf.json の version と一致させること。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: タグと tauri.conf.json のバージョンを照合
        run: |
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::タグ $TAG と tauri.conf.json の version ($VERSION) が一致しません"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: create
        name: 下書きのリリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 下書きはタグで検索できないことがあるので、作成時のレスポンスから ID を受け取る
          ID=$(gh api -X POST repos/${{ github.repository }}/releases \
            -f tag_name="$TAG" -f name="disnans $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$ID" ]; then
            echo "::error::リリースの作成に失敗しました"
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      # 各ジョブが latest.json を読んで書き換えるので、同時に動かすと競合する
      max-parallel: 1
      matrix:
        # AppImage を古い glibc の環境でも動かすため、Linux は古めの Ubuntu でビルドする
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Linux の依存ライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          updaterJsonPreferNsis: true
      # 公開（publish）の前に、同梱した CLI を確かめる。失敗すると desktop が失敗し、公開に進まない。
      - name: "Linux: .deb に CLI（/usr/bin/disnans）が入っているか確かめる"
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          DEB=$(ls app/src-tauri/target/release/bundle/deb/disnans_"${VERSION}"_*.deb)
          if [ "$(echo "$DEB" | wc -l)" -ne 1 ]; then
            echo "::error::この版の .deb が 1 つではありません: $DEB"; exit 1
          fi
          # パイプで grep -q すると、途中で閉じた dpkg-deb が失敗扱いになる（pipefail）ので、一度ファイルに書く
          dpkg-deb -c "$DEB" > "$RUNNER_TEMP/deb-list.txt"
          if ! grep -q ' usr/bin/disnans$' "$RUNNER_TEMP/deb-list.txt"; then
            echo "::error::.deb に usr/bin/disnans がありません"; exit 1
          fi
          rm -rf "$RUNNER_TEMP/deb-check"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb-check"
          CLI="$RUNNER_TEMP/deb-check/usr/bin/disnans"
          SIZE=$(stat -c %s "$CLI")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::CLI が stub のままです（$SIZE バイト）"; exit 1
          fi
          "$CLI" --version
          "$CLI" --help > /dev/null
          echo "CLI を確認しました（$SIZE バイト）"
      - name: "Windows: NSIS で CLI の PATH を確かめる（入れる → PATH → 外す → 元に戻る。長い PATH は変えない）"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setups = @(Get-ChildItem "app/src-tauri/target/release/bundle/nsis/disnans_$($version)_*-setup.exe")
          if ($setups.Count -ne 1) { throw "この版のインストーラが 1 つではありません: $($setups.Count)" }
          $setup = $setups[0].FullName
          $installDir = Join-Path $env:LOCALAPPDATA 'disnans'
          $cli = Join-Path $installDir 'disnans.exe'
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          $envKey = 'HKCU:\Environment'
          $markKey = 'HKCU:\Software\disnans-cli-path'

          function Get-UserPath { (Get-ItemProperty -Path $envKey -Name Path -ErrorAction SilentlyContinue).Path }
          function Test-SameValue($a, $b) {
            if ($null -eq $a -or $null -eq $b) { return ($null -eq $a) -and ($null -eq $b) }
            return ([string]$a) -ceq ([string]$b)
          }
          function Test-PathEntry([string]$path, [string]$dir) {
            if (-not $path) { return $false }
            return (($path -split ';') -contains $dir)
          }

          # 1 回の入れる → 確かめる → 外す → 確かめる。$expectAdded は「PATH に入るはず」か「入らないはず（長すぎる）」か
          function Invoke-RoundTrip([bool]$expectAdded, [string]$label) {
            if (Test-Path $markKey) { throw "${label}: インストール前から印が残っています" }
            $before = Get-UserPath
            Start-Process -FilePath $setup -ArgumentList '/S' -Wait
            if (-not (Test-Path $cli)) { throw "${label}: CLI が入っていません: $cli" }
            $size = (Get-Item $cli).Length
            if ($size -lt 100000) { throw "${label}: CLI が stub のままです（$size バイト）" }
            & $cli --version
            if ($LASTEXITCODE -ne 0) { throw "${label}: disnans --version が失敗しました" }
            $afterInstall = Get-UserPath
            if ($expectAdded) {
              if (-not (Test-PathEntry $afterInstall $installDir)) { throw "${label}: ユーザー PATH に $installDir がありません" }
              if (-not (Test-Path $markKey)) { throw "${label}: 印（$markKey）がありません" }
            } else {
              if (-not (Test-SameValue $afterInstall $before)) {
                throw "${label}: 長い PATH が変わりました（前 $(([string]$before).Length) 文字、後 $(([string]$afterInstall).Length) 文字）"
              }
              if (Test-Path $markKey) { throw "${label}: 長い PATH なのに印が付きました" }
            }
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
            $deadline = (Get-Date).AddSeconds(120)
            while ((Test-Path $cli) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
            if (Test-Path $cli) { throw "${label}: アンインストールが終わりません" }
            $after = Get-UserPath
            if (-not (Test-SameValue $after $before)) {
              throw "${label}: ユーザー PATH が元に戻りません。前: [$before] 後: [$after]"
            }
            if (Test-Path $markKey) { throw "${label}: 印が残っています" }
            Write-Host "${label}: OK"
          }

          # 1. 通常の PATH: 追加され、外すと元に戻る
          Invoke-RoundTrip -expectAdded $true -label '通常の PATH'

          # 2. 長い PATH（NSIS の上限 1024 でも 8192 でも超える 9100 文字）: 1 バイトも変えない
          #    NSIS は上限を超えた値を黙って切り詰めるので、切り詰めた PATH に追記すると壊れる。そのための確認
          $original = Get-UserPath
          $originalKind = $null
          try {
            $segment = 'C:\disnans-length-test\padding-entry;'
            $base = if ($original) { ([string]$original).TrimEnd(';') + ';' } else { '' }
            $pad = $segment * [int][math]::Ceiling(9100 / $segment.Length)
            $long = ($base + $pad).TrimEnd(';')
            if ($long.Length -lt 9100) { throw "テスト用の PATH が短すぎます: $($long.Length)" }
            Set-ItemProperty -Path $envKey -Name Path -Value $long -Type ExpandString
            if (-not (Test-SameValue (Get-UserPath) $long)) { throw '長い PATH の設定に失敗しました' }
            Invoke-RoundTrip -expectAdded $false -label '長い PATH（9100 文字）'
          } finally {
            # 元の PATH に戻す（無かったものは無いまま）
            if ($null -eq $original) {
              Remove-ItemProperty -Path $envKey -Name Path -ErrorAction SilentlyContinue
            } else {
              Set-ItemProperty -Path $envKey -Name Path -Value ([string]$original) -Type ExpandString
            }
          }
          if (-not (Test-SameValue (Get-UserPath) $original)) { throw 'テストの後に PATH を元に戻せませんでした' }
          Write-Host 'CLI の PATH の追加・削除と、長い PATH を変えないことを確認しました'

  android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: NDK をインストール
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: 署名の鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.jks"
          echo "DISNANS_KEYSTORE=$RUNNER_TEMP/android.jks" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - name: APK をビルド
        working-directory: app
        env:
          DISNANS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npx tauri android build --apk --target aarch64
      - name: リリースに追加
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          APK="disnans_${VERSION}_android-arm64.apk"
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          gh release upload "$TAG" "$APK"

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: リリースを公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo ${{ github.repository }} --draft=false --latest
