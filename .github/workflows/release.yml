# タグ（v0.1.1 など）を push すると、全プラットフォームをビルドして GitHub Releases に公開する。
# タグのバージョンは app/src-tauri/tauri.conf.json の version と一致させること。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: タグと tauri.conf.json のバージョンを照合
        run: |
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::タグ $TAG と tauri.conf.json の version ($VERSION) が一致しません"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: create
        name: 下書きのリリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 下書きはタグで検索できないことがあるので、作成時のレスポンスから ID を受け取る
          ID=$(gh api -X POST repos/${{ github.repository }}/releases \
            -f tag_name="$TAG" -f name="disnans $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$ID" ]; then
            echo "::error::リリースの作成に失敗しました"
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # AppImage を古い glibc の環境でも動かすため、Linux は古めの Ubuntu でビルドする
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Linux の依存ライブラリ
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          updaterJsonPreferNsis: true

  android:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: NDK をインストール
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: 署名の鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.jks"
          echo "DISNANS_KEYSTORE=$RUNNER_TEMP/android.jks" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: app
      - name: APK をビルド
        working-directory: app
        env:
          DISNANS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npx tauri android build --apk --target aarch64
      - name: リリースに追加
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          APK="disnans_${VERSION}_android-arm64.apk"
          cp app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          gh release upload "$TAG" "$APK"

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: リリースを公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo ${{ github.repository }} --draft=false --latest
