[package]
name = "disnans-app"
version = "0.1.0"
description = "disnans client"
edition = "2021"
publish = false

# ワークスペース（ルートの Cargo.toml）からは除外している。webkit2gtk などが必要なので単独でビルドする
[workspace]

[lib]
name = "disnans_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
