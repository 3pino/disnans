[package]
name = "disnans-app"
version = "0.1.0"
description = "disnans client"
edition = "2021"
publish = false

# ワークスペース（ルートの Cargo.toml）からは除外している。webkit2gtk などが必要なので単独でビルドする
[workspace]

[lib]
name = "disnans_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: システムトレイ（デスクトップ。Android では使わない）、image-png: トレイのアイコンに既定のウィンドウアイコンを使う
# devtools: 配布版でも Ctrl+Shift+I で開発者ツールを開けるようにする
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 単一インスタンス（デスクトップだけ）。2つ目の起動は新しく立ち上げず、既存のウィンドウを出す
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 開発用フォルダを選ぶダイアログ
tauri-plugin-dialog = "2"
# Linux: ドロップされたファイルを読む（パスから File にする）
tauri-plugin-fs = "2"
# Linux: クリップボードの画像を読む（WebView の paste で画像が取れないとき）
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# getUserMedia / WebRTC を有効にする設定（tauri が使うものと同じ版）
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-apk-updater = { path = "plugins/apk-updater" }
tauri-plugin-notifier = { path = "plugins/notifier" }
tauri-plugin-system-bars = { path = "plugins/system-bars" }
tauri-plugin-screen = { path = "plugins/screen" }
