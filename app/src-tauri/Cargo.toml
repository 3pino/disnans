[package]
name = "disnans-app"
version = "0.1.0"
description = "disnans client"
edition = "2021"
publish = false

# ワークスペース（ルートの Cargo.toml）からは除外している。webkit2gtk などが必要なので単独でビルドする
[workspace]

[lib]
name = "disnans_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: 配布版でも Ctrl+Shift+I で開発者ツールを開けるようにする
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 開発用フォルダを選ぶダイアログ
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# getUserMedia / WebRTC を有効にする設定（tauri が使うものと同じ版）
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-apk-updater = { path = "plugins/apk-updater" }
tauri-plugin-notifier = { path = "plugins/notifier" }
tauri-plugin-system-bars = { path = "plugins/system-bars" }
