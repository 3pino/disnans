[package]
name = "disnans-app"
version = "0.1.0"
description = "disnans client"
edition = "2021"
publish = false

# ワークスペース（ルートの Cargo.toml）からは除外している。webkit2gtk などが必要なので単独でビルドする
[workspace]

[lib]
name = "disnans_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: システムトレイ（デスクトップ。Android では使わない）、image-png: トレイのアイコンに既定のウィンドウアイコンを使う
# devtools: 配布版でも Ctrl+Shift+I で開発者ツールを開けるようにする
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 添付パネルの「最近の画像」（ピクチャのフォルダとサムネイル）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "tga"] }
dirs = "7"
# raw body（デスクトップ）と base64 の本体（Android）の復号。全 OS で使う
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# 単一インスタンス（デスクトップだけ）。2つ目の起動は新しく立ち上げず、既存のウィンドウを出す
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
disnans-client-core = { path = "../../crates/client-core", features = ["ws"] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 開発用フォルダを選ぶダイアログ
tauri-plugin-dialog = "2"
# Linux: ドロップされたファイルを読む（パスから File にする）
tauri-plugin-fs = "2"
# Linux: クリップボードの画像を読む（WebView の paste で画像が取れないとき）
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# ドロップされたファイルの読み取りでシンボリックリンクを辿らない
libc = "0.2"
# getUserMedia / WebRTC を有効にする設定（tauri が使うものと同じ版）
webkit2gtk = { version = "2", features = ["v2_40"] }
# 画面の静止画（screen_snapshot）: X11 のルートウィンドウを撮る（tauri が使うものと同じ版。新しいクレートは増えない）
gdk = "0.18"
# 通知を押したらウィンドウを前面に出す（desktop_notify.rs）。プラグインと同じ版・機能（新しいクレートは増えない）
notify-rust = "4.11"

# Linux のネイティブ画面共有（linux_capture.rs）: xdg-desktop-portal の ScreenCast（ashpd）で選んだ画面を、
# GStreamer の pipewiresrc → appsink で受ける。ビルドには libgstreamer1.0-dev / libgstreamer-plugins-base1.0-dev が要る
# （実行時は gstreamer1.0-pipewire・gstreamer1.0-plugins-base・xdg-desktop-portal）。
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
# JPEG の符号化（純 Rust・依存なし）。縮小と減色の結果を JPEG にする
jpeg-encoder = "0.6"
tokio = { version = "1", features = ["time"] }
tokio-util = "0.7"
futures-util = "0.3"

# 画面の静止画（screen_snapshot）: GDI で主モニターを撮る（tauri が使うものと同じ版。新しいクレートは増えない）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# 通知を押したときの動作（on_activated）を持つトーストを出す（notify-rust が使うものと同じ版。新しいクレートは増えない）
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
# REST（読取・書込み・アップロード）とチャット（ws）の Rust 経路（段4）
disnans-client-core = { path = "../../crates/client-core", features = ["ws"] }
tauri-plugin-apk-updater = { path = "plugins/apk-updater" }
tauri-plugin-notifier = { path = "plugins/notifier" }
tauri-plugin-system-bars = { path = "plugins/system-bars" }
tauri-plugin-screen = { path = "plugins/screen" }
