[package]
name = "disnans-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
disnans-shared = { path = "../shared" }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
mime = "0.3"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
tokio-tungstenite = "0.29"
