[package]
name = "disnans-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "disnans"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
disnans-client-core = { path = "../client-core", features = ["ws"] }
disnans-shared = { path = "../shared" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util", "io-std"] }

crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
jiff = "0.2"

[dev-dependencies]
axum = "0.8"
disnans-server = { path = "../server" }
tempfile = "3"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
