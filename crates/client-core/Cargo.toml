[package]
name = "disnans-client-core"
version.workspace = true
edition.workspace = true

[dependencies]
disnans-shared = { path = "../shared" }
# 証明書は OS のストア（社内 CA 等）と webpki の両方を使う（どちらか一方で検証できれば通る）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
url = "2"
# WebSocket client (feature `ws`). The desktop GUI keeps its TypeScript WebSocket for now, so it does not enable this.
fastrand = { version = "2", optional = true }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"], optional = true }
ulid = { version = "1", optional = true }

[features]
ws = ["dep:fastrand", "dep:tokio", "dep:tokio-tungstenite", "dep:ulid"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "time", "sync"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
